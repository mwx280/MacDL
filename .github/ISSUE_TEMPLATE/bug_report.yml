name: Bug report
description: Report a bug so we can fix it
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open MacDL
        2. ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: If the app printed anything relevant to Console, paste it here.
      render: shell
  - type: input
    id: os
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The version from About, or the release tag (e.g. v0.1.0)
      placeholder: e.g. v0.1.0
    validations:
      required: true
